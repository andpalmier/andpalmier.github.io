<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HexStrike-AI architecture</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b55d24"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="470" rx="14" fill="#fbfbfa" stroke="#dddddb"/>

  <rect x="20" y="60" width="200" height="100" rx="10" fill="#efefec" stroke="#8a8a87"/>
  <text x="120" y="92" font-size="15" font-weight="600" text-anchor="middle" fill="#222">MCP host</text>
  <text x="120" y="116" font-size="13" text-anchor="middle" fill="#444">Claude Desktop, Cursor, …</text>
  <text x="120" y="138" font-size="13" text-anchor="middle" fill="#444">the LLM lives here</text>

  <rect x="285" y="60" width="190" height="100" rx="10" fill="#2f5f8f"/>
  <text x="380" y="96" font-size="15" font-weight="600" text-anchor="middle" fill="#fff">hexstrike_mcp.py</text>
  <text x="380" y="122" font-size="13" text-anchor="middle" fill="#fff">151 MCP tools,</text>
  <text x="380" y="140" font-size="13" text-anchor="middle" fill="#fff">thin HTTP wrappers</text>
  <line x1="220" y1="110" x2="281" y2="110" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="251" y="100" font-size="12" text-anchor="middle" fill="#555">stdio</text>

  <rect x="545" y="45" width="230" height="130" rx="10" fill="#2f5f8f"/>
  <text x="660" y="78" font-size="15" font-weight="600" text-anchor="middle" fill="#fff">Flask API :8888</text>
  <text x="660" y="104" font-size="13" text-anchor="middle" fill="#fff">bound to 0.0.0.0</text>
  <text x="660" y="124" font-size="13" text-anchor="middle" fill="#fff">no authentication</text>
  <text x="660" y="144" font-size="13" text-anchor="middle" fill="#fff">156 routes</text>
  <line x1="475" y1="110" x2="541" y2="110" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="508" y="100" font-size="12" text-anchor="middle" fill="#555">HTTP</text>

  <rect x="545" y="235" width="230" height="64" rx="10" fill="#efefec" stroke="#8a8a87"/>
  <text x="660" y="262" font-size="14" text-anchor="middle" fill="#222">subprocess.Popen(</text>
  <text x="660" y="282" font-size="14" text-anchor="middle" fill="#222">…, shell=True)</text>
  <line x1="660" y1="175" x2="660" y2="231" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="545" y="350" width="230" height="64" rx="10" fill="#b55d24"/>
  <text x="660" y="378" font-size="14" text-anchor="middle" fill="#fff">nmap · gobuster · sqlmap ·</text>
  <text x="660" y="398" font-size="14" text-anchor="middle" fill="#fff">nuclei … (server-set flags)</text>
  <line x1="660" y1="299" x2="660" y2="346" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="835" y="60" width="245" height="100" rx="10" fill="#2f5f8f"/>
  <text x="957" y="90" font-size="14" font-weight="600" text-anchor="middle" fill="#fff">own HTTP clients</text>
  <text x="957" y="114" font-size="12.5" text-anchor="middle" fill="#fff">HexStrike-HTTP-Framework/1.0</text>
  <text x="957" y="134" font-size="12.5" text-anchor="middle" fill="#fff">HexStrike-BrowserAgent/1.0</text>
  <line x1="775" y1="110" x2="831" y2="110" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <circle cx="957" cy="382" r="52" fill="#efefec" stroke="#555" stroke-width="1.6"/>
  <text x="957" y="388" font-size="16" font-weight="600" text-anchor="middle" fill="#222">target</text>
  <line x1="775" y1="382" x2="901" y2="382" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="957" y1="160" x2="957" y2="326" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="20" y="240" width="260" height="76" rx="10" fill="none" stroke="#b55d24" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="150" y="270" font-size="14" text-anchor="middle" fill="#b55d24">anyone who can reach :8888</text>
  <text x="150" y="294" font-size="13" text-anchor="middle" fill="#b55d24">POST /api/command</text>
  <path d="M280,278 C420,278 460,150 541,150" fill="none" stroke="#b55d24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>

  <rect x="24" y="430" width="18" height="18" rx="3" fill="#2f5f8f"/>
  <text x="50" y="444" font-size="13" fill="#333">HexStrike code</text>
  <rect x="200" y="430" width="18" height="18" rx="3" fill="#b55d24"/>
  <text x="226" y="444" font-size="13" fill="#333">third-party tools, chosen by the model</text>
</svg>
